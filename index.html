<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<link rel="stylesheet" href="https://integrations.missiveapp.com/missive.css">
<script src="https://integrations.missiveapp.com/missive.js"></script>
<style>
  body { font: 14px -apple-system, system-ui, sans-serif; padding: 12px; color: var(--missive-text-color-a, #222); }
  button { width: 100%; padding: 10px; font-size: 15px; border: 0; border-radius: 6px; background: #d97757; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: #888; font-size: 12px; margin-top: 8px; word-break: break-all; }
  details { margin-top: 16px; }
  input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
</style>
</head>
<body>
  <button id="start" disabled>Claude på tråden</button>
  <div class="muted" id="hint" style="display:none">Beskeden "der er kommet nyt" ligger i udklipsholderen: ⌘V og Enter.</div>
  <div class="muted"><a href="#" id="startNew" style="display:none">Start en ny session i stedet</a></div>
  <div class="muted" id="subject">Vælg en tråd</div>

  <details>
    <summary>Indstillinger</summary>
    <label>Missive API-token (valgfri; så kan knappen åbne trådens tidligere Claude-session)
      <input id="token" type="password" placeholder="Fra Missive: Indstillinger → API">
    </label>
    <label>Kommando
      <input id="command" value="Kør mail-opgave på denne tråd:">
    </label>
  </details>

<script>
  var current = null;
  var startBtn = document.getElementById('start');
  var commandInput = document.getElementById('command');
  var tokenInput = document.getElementById('token');
  var startNew = document.getElementById('startNew');
  var existingSession = null;

  function save() {
    Missive.storeSet('command', commandInput.value.trim());
    Missive.storeSet('token', tokenInput.value.trim());
    if (current) findSession(current.id);
  }
  commandInput.addEventListener('change', save);
  tokenInput.addEventListener('change', save);

  Promise.all([Missive.storeGet('folder'), Missive.storeGet('command'), Missive.storeGet('token')]).then(function (v) {
    if (v[2]) tokenInput.value = v[2];
    if (v[1] && v[1].charAt(0) !== '/') commandInput.value = v[1];
  }).catch(function () {});

  function claudeUrl(conv) {
    var link = 'https://mail.missiveapp.com/#inbox/conversations/' + conv.id;
    var subject = (conv.subject || '').replace(/\s+/g, ' ').trim();
    var q = (subject ? subject + '\n\n' : '') + (commandInput.value.trim() || "Kør mail-opgave på denne tråd:") + ' ' + link;
    var url = 'claude://code/new?q=' + encodeURIComponent(q);
    return url;
  }

  // Look for the newest Claude session link in this thread's notes (needs the user's own API token).
  function findSession(convId) {
    existingSession = null; updateButton();
    var token = tokenInput.value.trim();
    if (!token) return;
    fetch('https://public.missiveapp.com/v1/conversations/' + convId + '/posts?limit=10', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { return r.ok ? r.json() : { posts: [] }; })
      .then(function (d) {
        if (!current || current.id !== convId) return;
        var re = /claude:\/\/claude\.ai\/epitaxy\/local_[A-Za-z0-9-]+/;
        (d.posts || []).some(function (p) {
          var text = JSON.stringify(p);
          var m = text.match(re);
          if (m) { existingSession = m[0]; return true; }
          return false;
        });
        updateButton();
      }).catch(function () {});
  }
  function updateButton() {
    startBtn.textContent = existingSession ? 'Fortsæt i Claude' : 'Claude på tråden';
    document.getElementById('hint').style.display = existingSession ? 'block' : 'none';
    startNew.style.display = existingSession ? 'inline' : 'none';
  }
  startNew.addEventListener('click', function (e) { e.preventDefault(); startFresh(); });

  function start() {
    if (existingSession) {
      var msg = 'Der er kommet nyt i tråden. Læs det, og fortsæt mail-opgave.';
      try { if (Missive.writeToClipboard) Missive.writeToClipboard(msg); else navigator.clipboard.writeText(msg); } catch (e) {}
      var url = existingSession;
      setTimeout(function () { Missive.openURL(url); }, 400);
      return;
    }
    startFresh();
  }
  function startFresh() {
    if (!current) { Missive.alert({ title: 'Vælg en tråd først' }); return; }
    Missive.openURL(claudeUrl(current));
  }
  startBtn.addEventListener('click', start);

  Missive.on('change:conversations', function (ids) {
    if (!ids || ids.length !== 1) {
      current = null; startBtn.disabled = true;
      document.getElementById('subject').textContent = 'Vælg én tråd';
      return;
    }
    Missive.fetchConversations(ids).then(function (convs) {
      current = convs[0];
      startBtn.disabled = false;
      findSession(current.id);
      document.getElementById('subject').textContent = current.subject || '(intet emne)';
    });
  }, { retroactive: true });

  Missive.setActions([{
    label: "Claude på tråden",
    emoji: '🤖',
    contexts: ['command_bar', 'conversation'],
    callback: start
  }]);
</script>
</body>
</html>
